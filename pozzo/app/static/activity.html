<!doctype html>
<html lang="it" data-mode="desktop">
<head>
<script src="/static/imgfallback.js?v={{v}}"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="a.act.title">Attività · Pozzo Launcher</title>
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<style>
  html, body { overflow: auto; }
  body { padding: 12px; }
  h1 { font-size: 16px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .act { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; }
  .act .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .act .name { font-weight: 600; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .phase, .act .last { font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .times { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--bg-3); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.indet i { width: 30%; animation: indet 1.2s ease-in-out infinite; }
  @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(333.333%); } }
  .act.done .bar i { background: var(--good); } .act.error .bar i { background: var(--bad); } .act.cancelled .bar i { background: var(--warn); }
  .act .badge { position: static; } .act .bar { display: block; } /* app.css li usa per copertine e grafici */
  .badge { flex: 0 0 auto; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--bg-3); color: var(--muted); }
  .act.running .badge { color: var(--accent); } .act.error .badge { color: var(--bad); } .act.done .badge { color: var(--good); }
  .stop { flex: 0 0 auto; background: var(--bg-3); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; color: var(--bad); }
  .stop:hover { border-color: var(--bad); }
  .remove { flex: 0 0 auto; background: var(--bg-3); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--muted); }
  .remove:hover { border-color: var(--accent); color: var(--accent); }
  .tools { display: flex; gap: 6px; margin: 0 0 10px; flex-wrap: wrap; flex: 0 0 auto; }
  .tools button { background: var(--bg-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; color: var(--fg); }
  .empty { text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<h1><span data-i18n="a.act.heading">Attività</span><span class="muted" id="sum"></span></h1>
<div class="tools">
  <button data-clear="finished" data-i18n="a.act.clearQueue">Svuota coda</button>
  <button data-clear="done-error" data-i18n="a.act.clearDone">Svuota completati e falliti</button>
</div>
<div id="list"></div>
<script src="/static/i18n.js?v={{v}}"></script>
<script src="/static/icons.js"></script>
<script src="/static/activity.js"></script>
</body>
</html>
