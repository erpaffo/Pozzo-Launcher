<!doctype html>
<html lang="it" data-mode="bigpicture">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pozzo Launcher · Big Picture</title>
<link rel="icon" href="/m/static/icon.png">
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<link rel="stylesheet" href="/static/bigpicture.css?v={{v}}">
<link rel="stylesheet" href="/static/media.css?v={{v}}">
<link rel="stylesheet" href="/static/motion.css?v={{v}}">
<link rel="stylesheet" href="/static/skeleton.css?v={{v}}">
</head>
<body>
<div id="bp">
  <div id="bp-bg"><div class="bg-img"></div><div class="bg-img next"></div></div>
  <header id="bp-top">
    <div class="bp-brand"><span class="logo">◆</span> Pozzo Launcher</div>
    <nav id="bp-nav"></nav>
    <div id="bp-exit"></div>
    <div class="bp-clock" id="bp-clock"></div>
  </header>
  <main id="bp-main"></main>
  <footer id="bp-hints"></footer>
  <div id="bp-running" hidden></div>
  <div id="bp-toast" role="status" aria-live="polite" hidden></div>
  <section id="bp-media-widget" aria-label="Musica e chiamate" hidden>
    <h2 class="media-title">Musica e chiamate</h2>
    <div class="media-now">
      <img id="bp-media-cover" alt="" hidden>
      <div class="media-track"><b id="bp-media-title">Nessun brano</b><span id="bp-media-artist" class="muted">Spotify non collegato</span></div>
    </div>
    <div class="media-progress"><span id="bp-media-progress"></span></div>
    <div class="media-controls">
      <button class="media-action" data-media-action="prev" type="button" aria-label="Brano precedente">&#9198;&#xFE0E;</button>
      <button class="media-action primary" data-media-action="play" type="button" aria-label="Riproduci o metti in pausa">&#9654;&#xFE0E; / &#10074;&#10074;</button>
      <button class="media-action" data-media-action="next" type="button" aria-label="Brano successivo">&#9197;&#xFE0E;</button>
      <button class="media-action" data-media-action="volume-down" type="button" aria-label="Abbassa volume">&minus;</button>
      <button class="media-action" data-media-action="volume-up" type="button" aria-label="Alza volume">+</button>
      <label class="media-volume">Volume Spotify <input id="bp-media-volume" type="range" min="0" max="100" value="50" aria-label="Volume Spotify"></label>
    </div>
    <div class="media-call">
      <span id="bp-discord-channel">Discord non connesso</span>
      <span id="bp-discord-participants" class="muted"></span>
      <button class="media-action" data-media-action="mute" type="button">Microfono</button>
      <button class="media-action" data-media-action="deafen" type="button">Audio</button>
      <button class="media-action" data-media-action="leave" type="button">Esci dalla chiamata</button>
    </div>
    <p id="bp-media-message" class="muted" role="status" aria-live="polite"></p>
  </section>
  <div id="bp-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="bp-loading"><div class="logo big">◆</div><p>Caricamento della libreria…</p></div>
</div>
<script src="/static/core.js?v={{v}}"></script>
<script src="/static/icons.js?v={{v}}"></script>
<script src="/static/reco.js"></script>
<script src="/static/shortcuts.js?v={{v}}"></script>
<script src="/static/pad.js?v={{v}}"></script>
<script src="/static/bigpicture/layouts.js?v={{v}}"></script>
<script src="/static/bigpicture/layouts/classic/layout.js?v={{v}}"></script>
<script src="/static/bigpicture.js?v={{v}}"></script>
<script src="/static/media.js?v={{v}}"></script>
<script src="/static/motion.js?v={{v}}"></script>
<script src="/static/motion-settings.js?v={{v}}"></script>
<script src="/static/splash.js?v={{v}}"></script>
<script src="/static/palette.js?v={{v}}"></script>
<script src="/static/onboarding.js?v={{v}}"></script>
<script src="/static/hints.js?v={{v}}"></script>
<script src="/static/i18n.js?v={{v}}"></script>
</body>
</html>
