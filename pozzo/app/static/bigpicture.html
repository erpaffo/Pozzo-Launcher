<!doctype html>
<html lang="it" data-mode="bigpicture">
<head>
<meta charset="utf-8">
<script>/* ui-boot: come GSUi.applyPrefs (core.js), ma prima del primo disegno */try{var u=JSON.parse(localStorage.getItem("gs.ui")),r=document.documentElement;if(u&&typeof u==="object"){if(typeof u.zoom==="number"&&u.zoom>=90&&u.zoom<=125&&u.zoom%5===0&&u.zoom!==100){r.dataset.uiZoom=u.zoom;r.style.setProperty("--ui-zoom",u.zoom/100)}if(u.density==="compact")r.dataset.uiDensity="compact"}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pozzo Launcher · Big Picture</title>
<link rel="icon" href="/m/static/icon.png">
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<link rel="stylesheet" href="/static/bigpicture.css?v={{v}}">
<link rel="stylesheet" href="/static/media.css?v={{v}}">
<link rel="stylesheet" href="/static/bigpicture-media.css?v={{v}}">
<link rel="stylesheet" href="/static/motion.css?v={{v}}">
<link rel="stylesheet" href="/static/skeleton.css?v={{v}}">
<link rel="stylesheet" href="/static/profile-picker.css?v={{v}}">
</head>
<body>
<div id="bp">
  <div id="bp-bg"><div class="bg-img"></div><div class="bg-img next"></div></div>
  <header id="bp-top">
    <div class="bp-brand"><span class="logo">◆</span> Pozzo Launcher</div>
    <nav id="bp-nav"></nav>
    <div id="bp-exit"></div>
    <div class="bp-clock" id="bp-clock"></div>
  </header>
  <main id="bp-main"></main>
  <footer id="bp-hints"></footer>
  <div id="bp-running" hidden></div>
  <div id="bp-attract" hidden aria-hidden="true"><div class="at-slide"></div><div class="at-slide"></div><div class="at-info"><b></b><span></span></div></div>
  <div id="bp-toast" role="status" aria-live="polite" hidden></div>
  <section id="bp-media-widget" data-i18n-aria="a.bp.media" hidden>
    <h2 class="media-title" data-i18n="a.bp.media">Musica e chiamate</h2>
    <div class="media-now">
      <img id="bp-media-cover" alt="" hidden>
      <div class="media-track"><b id="bp-media-title">Nessun brano</b><span id="bp-media-artist" class="muted">Spotify non collegato</span></div>
    </div>
    <div class="media-progress"><span id="bp-media-progress"></span></div>
    <div class="media-controls">
      <button class="media-action" data-media-action="prev" type="button" data-i18n-aria="a.bp.prevTrack">&#9198;&#xFE0E;</button>
      <button class="media-action primary" data-media-action="play" type="button" data-i18n-aria="a.bp.playPause">&#9654;&#xFE0E; / &#10074;&#10074;</button>
      <button class="media-action" data-media-action="next" type="button" data-i18n-aria="a.bp.nextTrack">&#9197;&#xFE0E;</button>
      <button class="media-action" data-media-action="volume-down" type="button" data-i18n-aria="a.bp.volDown">&minus;</button>
      <button class="media-action" data-media-action="volume-up" type="button" data-i18n-aria="a.bp.volUp">+</button>
      <label class="media-volume"><span data-i18n="a.bp.spotifyVolume">Volume Spotify</span> <input id="bp-media-volume" type="range" min="0" max="100" value="50" data-i18n-aria="a.bp.spotifyVolume"></label>
    </div>
    <div class="media-call">
      <span id="bp-discord-channel">Discord non connesso</span>
      <span id="bp-discord-participants" class="muted"></span>
      <button class="media-action" data-media-action="mute" type="button" data-i18n="a.bp.mic">Microfono</button>
      <button class="media-action" data-media-action="deafen" type="button" data-i18n="a.bp.audio">Audio</button>
      <button class="media-action" data-media-action="leave" type="button" data-i18n="a.bp.leave">Esci dalla chiamata</button>
    </div>
    <p id="bp-media-message" class="muted" role="status" aria-live="polite"></p>
  </section>
  <div id="bp-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="bp-loading"><div class="logo big">◆</div><p data-i18n="a.bp.loading">Caricamento della libreria…</p></div>
</div>
<script src="/static/core.js?v={{v}}"></script>
<script src="/static/i18n.js?v={{v}}"></script>
<script src="/static/icons.js?v={{v}}"></script>
<script src="/static/reco.js"></script>
<script src="/static/shortcuts.js?v={{v}}"></script>
<script src="/static/pad.js?v={{v}}"></script>
<script src="/static/bigpicture/layouts.js?v={{v}}"></script>
<script src="/static/bigpicture/layouts/classic/layout.js?v={{v}}"></script>
<script src="/static/bigpicture-media.js?v={{v}}"></script>
<script src="/static/bigpicture.js?v={{v}}"></script>
<script src="/static/media.js?v={{v}}"></script>
<script src="/static/motion.js?v={{v}}"></script>
<script src="/static/motion-settings.js?v={{v}}"></script>
<script src="/static/splash.js?v={{v}}"></script>
<script src="/static/profile-picker.js?v={{v}}"></script>
<script src="/static/palette.js?v={{v}}"></script>
<script src="/static/onboarding.js?v={{v}}"></script>
<script src="/static/hints.js?v={{v}}"></script>
</body>
</html>
