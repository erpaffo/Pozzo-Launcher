[plugin]
name = "Ricette web"
version = "1.0"
author = "Pozzo Launcher"
icon = "🌐"
description = "Estrae film, serie e podcast da siti web leciti e feed aperti tramite ricette dichiarative TOML, senza codice eseguito."
long_description = "Aggiunge a Pozzo Media la possibilità di consultare cataloghi online tramite «ricette» dichiarative in formato TOML. Include ricette per i film classici di pubblico dominio di Internet Archive e i podcast della NASA, con supporto per pagine HTML, feed RSS/XML e dati JSON. Le richieste rispettano il file robots.txt e usano cache su disco con ETag e rate limiting. I contenuti si integrano nella pagina dedicata con griglia, dettagli, episodi e ripresa della riproduzione. Per motivi di sicurezza, nessun codice eseguibile è consentito nelle ricette e le chiamate di rete sono limitate ai soli domini autorizzati."
how_it_works = "1. Installa l'estensione e riavvia Pozzo Launcher.\n2. Apri la pagina «Ricette web» dalla barra laterale sinistra.\n3. Esplora i cataloghi inclusi (Internet Archive e NASA Podcast) o usa la barra di ricerca.\n4. Seleziona una scheda per visualizzare descrizione, copertina ed elenco degli episodi.\n5. Avvia la riproduzione dal player integrato o dal lettore esterno.\n6. Dalla scheda «Anteprima ricetta» puoi visualizzare la definizione TOML delle fonti attive."
features = [
  "Cataloghi multimediali da fonti web lecite tramite ricette TOML dichiarative",
  "Ricette di esempio incluse: film classici di pubblico dominio da Internet Archive e podcast NASA",
  "Supporto per sorgenti HTML (selettori CSS), feed podcast RSS/XML e API JSON",
  "Pagina dedicata con griglia filtrabile per ricetta, ricerca testuale e schede dettaglio",
  "Supporto per contenuti a episodi con riproduzione diretta e salvataggio posizione",
  "Scheda «Anteprima ricetta» per ispezionare la struttura dichiarativa delle fonti attive",
  "Cache locale su disco con ETag, rate limiting e rispetto del file robots.txt",
  "Massima sicurezza: nessun codice eseguibile consentito e chiamate limitate all'host dichiarato"
]
api = 2
min_app = "0.15.0"
permissions = ["rete:archive.org", "rete:www.nasa.gov"]
