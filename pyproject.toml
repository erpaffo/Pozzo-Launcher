# Config dei soli strumenti di lint: ruff qui, bandit con flag espliciti in ci.yml.

[tool.ruff]
target-version = "py312"
# codice di terzi copiato così com'è: non si tocca (anche bandit lo esclude con -x)
extend-exclude = ["pozzo/vendor"]

# Stesse regole minime del job "lint" (ruff check pozzo): errori veri, non stile.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
