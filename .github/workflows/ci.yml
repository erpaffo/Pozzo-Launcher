# Test a ogni push su main e a ogni pull request: un errore si vede subito, non solo al tag della release.
# Stessi passi di preparazione del job "build" di release.yml.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # un job per sistema, test in parallelo su tutti i core (-j 0): meno job in coda (macOS soprattutto) e una sola
  # installazione delle dipendenze per sistema. Prima erano 3 parti per sistema in sequenza (9 job).
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # un job bloccato non resta appeso fino alla cancellazione
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          - { os: ubuntu-22.04, name: linux }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Dipendenze Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pywebview[qt]"; fi

      - name: Test
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
        run: python packaging/run_tests.py -j 0

  # Lint e sicurezza: ruff, bandit e pip-audit bloccano tutti. Il job non deve avere continue-on-error, altrimenti
  # il workflow non fallisce.
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze Python
        run: pip install -r requirements-dev.txt

      - name: Ruff (regole minime, vedi pyproject.toml)
        env:
          PYTHONUTF8: "1"
        run: ruff check pozzo

      - name: Bandit (sicurezza, solo severità media/alta)
        run: bandit -ll -r pozzo -x pozzo/vendor

      - name: pip-audit (vulnerabilità nelle dipendenze)
        run: pip-audit -r requirements.txt

  # Notturno/manuale, mai bloccante per push e PR: emulatore vero + ROM libera (tests/smoke).
  smoke:
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: RetroArch e core gambatte
        run: sudo apt-get update && sudo apt-get install -y retroarch libretro-gambatte xvfb

      - name: Dipendenze Python
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Smoke test
        env:
          PYTHONUTF8: "1"
          RETROARCH_EXE: /usr/bin/retroarch
          RETROARCH_CORES_DIR: /usr/lib/x86_64-linux-gnu/libretro
        run: xvfb-run -a python -m pytest -m smoke tests/smoke -q -rs
