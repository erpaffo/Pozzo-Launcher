# Crea gli eseguibili per Windows, macOS e Linux, ciascuno x64 e ARM64, e li pubblica nella release: per ogni
# variante la versione portatile (zip / tar.gz) e l'installer (Windows setup.exe, macOS .dmg, Linux .deb).
# Poi pubblica sui gestori di pacchetti: indice apt firmato negli asset della release, AUR, tap Homebrew, bucket
# Scoop e pull request a winget-pkgs. Ogni gestore parte solo se c'e' il suo secret (vedi i job publish-*).
#
# Avvio: crea e invia un tag di versione, es.
#   git tag v0.1.0 && git push origin v0.1.0
# oppure lancia il workflow a mano da GitHub (Actions > Release > Run workflow): in quel caso gli
# eseguibili restano scaricabili come "artifact" del workflow (direttamente lo zip / tar.gz, non uno zip
# dentro un altro zip), senza creare una release.

name: Release

on:
  push:
    tags: ["v*"]
  # a mano (Actions > Release > Run workflow): scegli il tag in «Use workflow from» per pubblicare quella release;
  # con skip_tests salta i test (lunghi), la build e la pubblicazione restano uguali
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Salta i test (pubblica comunque build e release se il ref e' un tag v*)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # la versione in pozzo/__init__.py deve essere quella del tag: se no l'app installata si vede "vecchia"
  # e propone all'infinito lo stesso aggiornamento. Se differiscono, corregge __init__, committa sul branch
  # di default e sposta il tag sul nuovo commit; gli altri job fanno checkout di quel commit (nessun rilancio:
  # i push fatti con GITHUB_TOKEN non fanno partire altri workflow, quindi niente cicli).
  version:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.fix.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Allinea __version__ al tag
        id: fix
        shell: bash
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          [ "$GITHUB_REF_TYPE" = "tag" ] || exit 0
          TAGVER="${GITHUB_REF_NAME#v}"
          CODEVER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pozzo/__init__.py | tr -d '\r')
          [ "$TAGVER" != "$CODEVER" ] || exit 0
          echo "::warning::__version__ ($CODEVER) diverso dal tag ($TAGVER): lo correggo"
          sed -i "s/^__version__ = .*/__version__ = \"$TAGVER\"/" pozzo/__init__.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Versione $TAGVER in __init__ allineata al tag"
          git push origin "HEAD:refs/heads/$BRANCH"
          git tag -f "$GITHUB_REF_NAME"
          git push -f origin "$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # i test girano accanto alla build (un job per sistema, test in parallelo sui core); la release parte solo se
  # sono tutti verdi
  test:
    needs: version
    if: ${{ !inputs.skip_tests }}
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-22.04, name: linux-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1

      - name: Dipendenze Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pywebview[qt]"; fi

      - name: Test
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"  # l'output dei test arriva subito: un blocco si vede dove succede
        run: python packaging/run_tests.py -j 0

  # una build per sistema e processore, ognuna sul suo runner (PyInstaller non compila per un'altra CPU).
  # I test girano solo sulle tre x64/arm64 del job test: il codice e' lo stesso, qui la prova di avvio basta.
  build:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, arch: x64 }
          # windows-arm64 (windows-11-arm) tolta: cryptography non ha wheel win_arm64 e dai sorgenti serve OpenSSL ARM64 (roadmap 0.20.0)
          - { name: macos-arm64, os: macos-latest, arch: arm64 }
          - { name: macos-x64, os: macos-15-intel, arch: x64 }
          - { name: linux-x64, os: ubuntu-22.04, arch: x64 }
          - { name: linux-arm64, os: ubuntu-24.04-arm, arch: arm64 }  # le wheel aarch64 di PyQt6 vogliono glibc >= 2.39
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Dipendenze di sistema (Linux)
        if: runner.os == 'Linux'
        # librerie del plugin xcb di Qt (le stesse sono le dipendenze del .deb, piu' sotto)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Dipendenze Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller
          # Linux: finestra con Qt (autonoma). Senza, l'app si apre comunque nel browser.
          if [ "$RUNNER_OS" = "Linux" ]; then pip install "pywebview[qt]"; fi

      - name: Build
        run: pyinstaller packaging/pozzo.spec --noconfirm --distpath dist --workpath build

      - name: Prova di avvio (smoke test)
        shell: bash
        env:
          QT_DEBUG_PLUGINS: "1"  # se Qt non parte, il log dice quale libreria manca davvero
        run: |
          # Verifica che l'eseguibile compilato si avvii e risponda su GET /api/status (su Linux serve Xvfb per la GUI Qt).
          case "$RUNNER_OS" in
            Windows) python packaging/smoke_test.py dist/PozzoLauncher/PozzoLauncher.exe ;;
            macOS)   python packaging/smoke_test.py dist/PozzoLauncher.app
                     codesign --verify --deep --strict dist/PozzoLauncher.app ;;  # sigillo valido (aggiornamenti)
            Linux)   xvfb-run -a python packaging/smoke_test.py dist/PozzoLauncher/PozzoLauncher ;;
          esac

      # Firma Windows: gira solo se il secret WIN_CODESIGN_PFX_BASE64 esiste (certificato .pfx in base64);
      # altrimenti questi step saltano e la build esce con eseguibili non firmati, senza errori.
      - name: Firma Windows attiva?
        id: sign_check
        shell: bash
        env:
          PFX_B64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
        run: |
          if [ -n "$PFX_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Firma Windows saltata: manca il secret WIN_CODESIGN_PFX_BASE64."
          fi

      # firma gli .exe di dist/ prima del pacchetto, cosi' lo zip portatile e l'installer contengono file firmati
      - name: Firma eseguibili (Windows)
        if: runner.os == 'Windows' && steps.sign_check.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WIN_CODESIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          # signtool sta nel Windows SDK del runner: prendo la versione piu' recente (x64)
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool non trovato" }
          foreach ($f in Get-ChildItem dist\PozzoLauncher -Filter *.exe -Recurse) {
            & $signtool.FullName sign /f $pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Pozzo Launcher" $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "firma fallita: $($f.Name)" }
          }
          Remove-Item $pfx -Force

      - name: Pacchetto
        id: pack
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # avvio a mano da un branch: la versione scritta nel codice
          [ "$GITHUB_REF_TYPE" = "tag" ] || VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' pozzo/__init__.py | tr -d '\r')
          OUT="PozzoLauncher-${VER}-${{ matrix.name }}"
          mkdir -p release
          case "$RUNNER_OS" in
            Windows) FILE="release/${OUT}.zip"
                     # il runner ARM64 puo' non avere 7-Zip: stesso zip (cartella PozzoLauncher alla radice)
                     if command -v 7z >/dev/null; then 7z a -tzip "$FILE" ./dist/PozzoLauncher >/dev/null
                     else powershell -NoProfile -Command "Compress-Archive -Path dist/PozzoLauncher -DestinationPath '$FILE'"; fi ;;
            macOS)   FILE="release/${OUT}.zip";    codesign --force --deep -s - dist/PozzoLauncher.app; ditto -c -k --keepParent dist/PozzoLauncher.app "$FILE" ;;
            Linux)   FILE="release/${OUT}.tar.gz"; tar -czf "$FILE" -C dist PozzoLauncher ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          ls -la release

      # Installer accanto alla versione portatile: Windows .exe (Inno Setup), macOS .dmg, Linux .deb.
      # I nomi dei file sono quelli che cerca l'aggiornamento dall'app (pozzo/updates.py, SUFFIX).
      - name: Installer
        id: inst
        shell: bash
        run: |
          VER="${{ steps.pack.outputs.ver }}"
          ARCH="${{ matrix.arch }}"
          case "$RUNNER_OS" in
            Windows)
              iscc() { compgen -G "/c/Program Files*/Inno Setup*/ISCC.exe" | head -n 1; }
              if [ -z "$(iscc)" ]; then
                if command -v choco >/dev/null; then choco install innosetup -y --no-progress >/dev/null
                else  # runner ARM64 senza Chocolatey: installer ufficiale (x86, gira emulato)
                  curl -fsSL -o "$RUNNER_TEMP/is.exe" https://jrsoftware.org/download.php/is.exe
                  MSYS_NO_PATHCONV=1 "$RUNNER_TEMP/is.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
                fi
              fi
              "$(iscc)" -Q "-DAppVersion=$VER" "-DAppArch=$ARCH" packaging/installer.iss
              FILE="release/PozzoLauncher-${VER}-windows-${ARCH}-setup.exe" ;;
            macOS)
              mkdir dmg && cp -R dist/PozzoLauncher.app dmg/ && ln -s /Applications dmg/Applications
              FILE="release/PozzoLauncher-${VER}-macos-${ARCH}.dmg"
              hdiutil create -volname PozzoLauncher -srcfolder dmg -ov -format UDZO "$FILE" ;;
            Linux)
              DEBARCH=$([ "$ARCH" = arm64 ] && echo arm64 || echo amd64)  # nomi di Debian
              DEBVER="$VER"; [[ "$VER" =~ ^[0-9] ]] || DEBVER="0.0.0~$VER"  # dpkg vuole un numero all'inizio
              P=pkg
              mkdir -p $P/DEBIAN $P/opt $P/usr/bin $P/usr/share/applications $P/usr/share/pixmaps
              cp -r dist/PozzoLauncher $P/opt/PozzoLauncher
              ln -s /opt/PozzoLauncher/PozzoLauncher $P/usr/bin/pozzo
              cp packaging/icon.png $P/usr/share/pixmaps/pozzo.png
              printf '%s\n' "[Desktop Entry]" "Type=Application" "Name=Pozzo Launcher" \
                "Comment=Libreria di giochi: ROM e store PC" "Exec=/opt/PozzoLauncher/PozzoLauncher" \
                "Icon=pozzo" "Categories=Game;" > $P/usr/share/applications/pozzo.desktop
              printf '%s\n' "Package: pozzo" "Version: $DEBVER" "Architecture: $DEBARCH" "Maintainer: erpaffo" \
                "Depends: libegl1, libnss3, libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-randr0, libxcb-render-util0, libxcb-shape0, libxcb-xfixes0, libxcb-xinerama0, libxcb-xkb1" \
                "Description: Pozzo Launcher - libreria di giochi con copertine e metadati" > $P/DEBIAN/control
              FILE="release/pozzo_${DEBVER}_${DEBARCH}.deb"
              dpkg-deb --root-owner-group --build $P "$FILE" ;;
          esac
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          ls -la release

      # firma dell'installer (stesso secret dei sopra); l'impronta nel manifest winget va calcolata dopo questo step
      - name: Firma installer (Windows)
        if: runner.os == 'Windows' && steps.sign_check.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WIN_CODESIGN_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WIN_CODESIGN_PASSWORD }}
          SETUP: ${{ steps.inst.outputs.file }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool non trovato" }
          & $signtool.FullName sign /f $pfx /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Pozzo Launcher" $env:SETUP
          if ($LASTEXITCODE -ne 0) { throw "firma fallita: installer" }
          Remove-Item $pfx -Force

      # archive: false = il file (gia' uno zip / tar.gz) si scarica cosi' com'e', senza lo zip esterno che
      # upload-artifact aggiunge di solito; il nome dell'artifact e' il nome del file.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.inst.outputs.file }}
          archive: false

  release:
    # parte anche se una build e' fallita: si pubblicano le piattaforme riuscite (vedi «Piattaforme mancanti»)
    # (ma solo con i test verdi, o saltati a mano con skip_tests)
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') && startsWith(github.ref, 'refs/tags/v') }}
    needs: [version, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}

      - uses: actions/download-artifact@v8
        continue-on-error: true  # nessun artifact = nessuna build riuscita: lo dice «Piattaforme mancanti»
        with:
          path: release
          merge-multiple: true
          # gli artifact sono gia' i file finali (archive: false): senza questo gli .zip portatili
          # verrebbero estratti in cartelle e mancherebbero nella release
          skip-decompress: true

      # rilanciando un job fallito c'e' gia' l'artifact dei manifest dei gestori: non e' un file della release
      - name: Solo i file della release
        run: rm -rf release/package-manifests* release/manifest-winget-scoop*

      # senza l'installer Windows la release diventa «latest» e l'app installata propone un aggiornamento che non
      # riesce a scaricare: meglio non pubblicare (le altre piattaforme mancanti restano non bloccanti)
      - name: Installer Windows presente?
        run: |
          compgen -G "release/PozzoLauncher-${GITHUB_REF_NAME#v}-windows-x64-setup.exe" > /dev/null || {
            echo "::error::installer Windows (PozzoLauncher-${GITHUB_REF_NAME#v}-windows-x64-setup.exe) mancante: release non pubblicata"
            exit 1
          }

      # manuale in PDF tra i file della release (stesso testo del sito, vedi docs.yml)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pacchetti TeX e apt
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-texlive-v1
          restore-keys: ${{ runner.os }}-apt-texlive-

      - name: Manuale PDF
        continue-on-error: true  # senza manuale la release esce comunque (lo segnala «Piattaforme mancanti»)
        run: |
          pip install pyyaml
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pandoc texlive-xetex texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-italian lmodern fonts-dejavu-core
          python tools/docs_pdf.py "release/PozzoLauncher-${GITHUB_REF_NAME#v}-manuale.pdf"

      # testo della release: la sezione "## <versione>" di changelog.md (fino alla sezione seguente)
      - name: Novità della versione
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## /{p = ($2 == v); next} p' changelog.md > notes.md
          [ -s notes.md ] || echo "Nessuna voce per la versione $VER in changelog.md." > notes.md
          cat notes.md

      # le build fallite non bloccano la release: si pubblica cio' che c'e' e si avvisa di cio' che manca
      # (nelle note della release, nel riepilogo del run e come avviso); nessuna build riuscita = niente release
      - name: Piattaforme mancanti
        run: |
          mkdir -p release
          missing="" found=0
          for p in windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64; do
            if compgen -G "release/*${p}*" > /dev/null; then found=1; else missing="$missing $p"; fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::nessuna build riuscita: release non pubblicata"
            exit 1
          fi
          compgen -G "release/*manuale.pdf" > /dev/null || missing="$missing manuale-PDF"
          if [ -n "$missing" ]; then
            echo "::warning::release pubblicata senza:$missing (vedi i job falliti)"
            printf '\n\n> **Attenzione:** in questa release mancano i file per:%s. La build non è riuscita: arriveranno in una versione successiva.\n' "$missing" >> notes.md
            echo "Release pubblicata senza:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      # manifest dei file dei pacchetti portatili (senza asset per file): l'updater verifica con questo il
      # pacchetto completo estratto, e sign-manifest lo firma. Se fallisce si pubblica senza, come prima.
      - name: Manifest aggiornamento
        continue-on-error: true
        run: python tools/release_manifest.py "$GITHUB_REF_NAME" release --solo-manifest

      # Repository apt «flat» negli asset stessi della release: apt legge Packages/InRelease da
      #   https://github.com/<repo>/releases/latest/download/ ./
      # che GitHub rimanda sempre all'ultima release (i .deb da 200+ MB non entrerebbero in un repo git).
      # Firma con la chiave GPG del secret APT_GPG_PRIVATE_KEY (passphrase facoltativa in APT_GPG_PASSPHRASE);
      # senza secret si salta e la release esce senza indice apt.
      - name: Indice apt firmato
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "::notice::APT_GPG_PRIVATE_KEY assente: niente indice apt"; exit 0; }
          compgen -G "release/*.deb" > /dev/null || { echo "::warning::nessun .deb: niente indice apt"; exit 0; }
          command -v apt-ftparchive > /dev/null || sudo apt-get install -y apt-utils
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          PASS=(); [ -z "$APT_GPG_PASSPHRASE" ] || PASS=(--pinentry-mode loopback --passphrase "$APT_GPG_PASSPHRASE")
          cd release
          apt-ftparchive packages . > Packages
          gzip -9kn Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="Pozzo Launcher" -o APT::FTPArchive::Release::Label="Pozzo Launcher" \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures="amd64 arm64" release . > Release
          gpg --batch --yes "${PASS[@]}" -u "$KEY" --clearsign -o InRelease Release
          gpg --batch --yes "${PASS[@]}" -u "$KEY" -abs -o Release.gpg Release
          gpg --batch --export "$KEY" > pozzo-archive-keyring.gpg  # chiave pubblica per /etc/apt/keyrings
          gpg --batch --verify InRelease  # firma leggibile prima di pubblicarla
          grep -c '^Package:' Packages
          rm -rf "$GNUPGHOME"

      # impronte SHA-256 di tutti i file: chi scarica puo' verificare che siano integri (gli eseguibili non sono firmati)
      - name: Checksum
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: notes.md

  # pubblicazione sui gestori di pacchetti: stessa logica di publish-stores.yml (a mano)
  stores:
    name: gestori di pacchetti
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/_publish-stores.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # firma Ed25519 del manifest di aggiornamento. Se PUBKEY in pozzo/updates.py e' vuota salta senza secret/manifest;
  # se e' impostata il job FALLISCE in quei casi. Carica <manifest>.sig accanto al manifest.
  sign-manifest:
    name: firma manifest aggiornamento
    needs: [release]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Firma del manifest
        shell: bash
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # con PUBKEY impostata i client rifiutano release non firmate: qui non si puo' saltare in silenzio
          ACTIVE=0; grep -qE '^PUBKEY = "[^"]+"' pozzo/updates.py && ACTIVE=1
          if [ -z "$MANIFEST_SIGNING_KEY" ]; then
            if [ "$ACTIVE" = 1 ]; then echo "::error::PUBKEY impostata ma secret MANIFEST_SIGNING_KEY assente: release non firmata, nessun client si aggiornera'"; exit 1; fi
            echo "::notice::MANIFEST_SIGNING_KEY assente: manifest non firmato"; exit 0
          fi
          mkdir sign && cd sign
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*-manifest.json' || true
          M=$(compgen -G "*-manifest.json" | head -n 1)
          if [ -z "$M" ]; then
            if [ "$ACTIVE" = 1 ]; then echo "::error::PUBKEY impostata ma nessun manifest nella release: niente da firmare"; exit 1; fi
            echo "::notice::nessun manifest nella release: niente da firmare"; exit 0
          fi
          pip install cryptography
          python ../tools/sign_manifest.py sign "$M"
          gh release upload "$TAG" "$M.sig" --repo "${{ github.repository }}" --clobber
