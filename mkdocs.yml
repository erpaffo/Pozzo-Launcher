# Manuale di Pozzo Launcher: sito (MkDocs Material, GitHub Pages) e PDF (tools/docs_pdf.py, stesso ordine di "nav").
site_name: Pozzo Launcher
site_description: Manuale di Pozzo Launcher, la libreria di giochi per ROM e store PC
repo_name: erpaffo/Pozzo-Launcher
repo_url: https://github.com/erpaffo/Pozzo-Launcher
copyright: "Copyright &copy; 2026 Pozzo Launcher"
docs_dir: docs
exclude_docs: |
  obsidian/
  TODO.md

theme:
  name: material
  language: it
  logo: images/icon.png
  favicon: images/icon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Passa al tema scuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Passa al tema chiaro }

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Introduzione: index.md
  - Centro Assistenza e FAQ: assistenza.md
  - Primi passi:
      - Installazione e aggiornamenti: installazione.md
      - La libreria: libreria.md
  - Giochi:
      - ROM e scraping dei dati: rom-e-scraping.md
      - Giocare: giocare.md
      - Giochi PC dagli store: store-pc.md
  - Store:
      - Aggiungere store online e store PC: store-online.md
      - Giochi gratis, lista desideri, port PC: extra.md
  - Altri modi di giocare:
      - Telefono e streaming: telefono-streaming.md
      - Big Picture: bigpicture.md
      - Musica e chiamate: musica-chiamate.md
      - Scorciatoie da tastiera e controller: scorciatoie.md
  - Personalizzare:
      - Temi e plugin: ESTENSIONI.md
  - Manutenzione:
      - Dati, copie di sicurezza e salute: manutenzione.md
      - Riferimento (configurazione e comandi): riferimento.md
  - Per sviluppatori:
      - Sviluppo e prestazioni: sviluppo.md
