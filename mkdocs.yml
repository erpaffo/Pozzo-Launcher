# Manuale e Sito Ufficiale di Pozzo Launcher (MkDocs Material, GitHub Pages) e PDF (tools/docs_pdf.py).
site_name: Pozzo Launcher
site_description: Il launcher universale per ROM di console e store PC. Gratuito, open source e locale.
repo_name: erpaffo/Pozzo-Launcher
repo_url: https://github.com/erpaffo/Pozzo-Launcher
copyright: "Copyright &copy; 2026 Pozzo Launcher"
docs_dir: docs
exclude_docs: |
  obsidian/
  TODO.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/download.js

theme:
  name: material
  language: it
  logo: images/icon.png
  favicon: images/icon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Passa al tema scuro }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Passa al tema chiaro }

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Download: download.md
  - Documentazione:
      - Guida introduttiva: guida.md
      - Primi passi:
          - Installazione e aggiornamenti: installazione.md
          - La libreria: libreria.md
      - Giochi:
          - ROM e scraping dei dati: rom-e-scraping.md
          - Giocare: giocare.md
          - Giochi PC dagli store: store-pc.md
      - Store:
          - Aggiungere store online e store PC: store-online.md
          - Giochi gratis, lista desideri, port PC: extra.md
      - Altri modi di giocare:
          - Telefono e streaming: telefono-streaming.md
          - Big Picture: bigpicture.md
          - Musica e chiamate: musica-chiamate.md
          - Scorciatoie da tastiera e controller: scorciatoie.md
      - Personalizzare:
          - Temi e plugin: ESTENSIONI.md
      - Manutenzione:
          - Dati, copie di sicurezza e salute: manutenzione.md
          - Riferimento (configurazione e comandi): riferimento.md
      - Per sviluppatori:
          - Sviluppo e prestazioni: sviluppo.md
  - Assistenza e FAQ: assistenza.md
  - English Manual:
      - Home: en/index.md
      - Download: en/download.md
      - Documentation:
          - Getting Started: en/guida.md
          - First Steps:
              - Installation & Updates: en/installazione.md
              - The Library: en/libreria.md
          - Games:
              - ROMs & Scraping: en/rom-e-scraping.md
              - Playing: en/giocare.md
              - PC Store Games: en/store-pc.md
          - Stores:
              - Online Stores & PC Stores: en/store-online.md
              - Free Games, Wishlist, PC Ports: en/extra.md
          - Alternative Play:
              - Phone & Streaming: en/telefono-streaming.md
              - Big Picture: en/bigpicture.md
              - Music & Calls: en/musica-chiamate.md
              - Keyboard & Controller Shortcuts: en/scorciatoie.md
          - Customization:
              - Themes & Extensions: en/ESTENSIONI.md
          - Maintenance:
              - Data, Backups & Health: en/manutenzione.md
              - Reference (Configuration & Commands): en/riferimento.md
          - Developers:
